<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c3626">
<title>血战到底</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="board">
  <div id="table"></div>
  <div class="seat seat-top" id="seat-top"></div>
  <div class="seat seat-left" id="seat-left"></div>
  <div class="seat seat-right" id="seat-right"></div>

  <div id="center">
    <div class="river" id="river-2"></div>
    <div class="river" id="river-3"></div>
    <div class="river" id="river-1"></div>
    <div class="river" id="river-0"></div>
    <div id="centerPlate">
      <span class="plate-title">血战到底</span>
      <b id="centerPlateNum">0</b>
      <span class="plate-sub">剩余张数</span>
    </div>
  </div>
  <div id="hud" class="hidden">
    <div id="centerInfo">剩 0</div>
    <button id="btnHudLevel" class="hud-btn">进阶</button>
    <button id="btnHudQuit" class="hud-btn">退出</button>
    <div id="hudLevel" class="hud-level">
      <button data-lv="0">入门</button>
      <button data-lv="1">进阶</button>
      <button data-lv="2">高手</button>
    </div>
  </div>

  <div class="seat seat-self" id="seat-self"></div>
</div>

<div id="logBox"></div>
<div id="actions" class="actions"></div>

<div id="lackOverlay" class="overlay"></div>
<div id="resultOverlay" class="overlay"></div>

<div id="homeOverlay" class="overlay on">
  <div class="panel home">
    <h1>血战到底</h1>
    <p class="sub">四川麻将 · 定缺 · 四人血战</p>
    <div class="level-row" id="levelRow">
      <button data-lv="0">入门</button>
      <button data-lv="1" class="on">进阶</button>
      <button data-lv="2">高手</button>
    </div>
    <div class="home-btns">
      <button id="btnPlay">开始对局</button>
      <button id="btnWatch" class="ghost">看机器人打</button>
    </div>
    <ul class="rules">
      <li>开局定缺，缺门的牌必须先打完</li>
      <li>胡牌不用停，血战到只剩一家</li>
      <li>碰杠有番，点炮自摸都算钱</li>
    </ul>
    <button id="btnSound" class="sound">语音：开</button>
  </div>
</div>

<script src="js/rule.js"></script>
<script src="js/ai.js"></script>
<script src="js/voice.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
