<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>楚汉象棋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
// 兼容性加固：任何 JS 报错直接显示在屏幕上，便于真机排查
window.onerror = function (msg, src, line) {
  try {
    var bar = document.getElementById('errbar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'errbar';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#c0392b;color:#fff;font-size:12px;padding:6px 10px;word-break:break-all;';
      (document.body || document.documentElement).appendChild(bar);
    }
    bar.textContent = '脚本错误: ' + msg + ' @' + (src || '') + ':' + line;
  } catch (e) {}
};
</script>
<div id="app">
  <header>
    <h1>楚汉象棋</h1>
    <span id="status" class="status normal">红方走棋</span>
  </header>

  <div id="board-wrap">
    <canvas id="board"></canvas>

    <!-- 开局遮罩 -->
    <div id="start-overlay" class="overlay" style="display:none">
      <div class="panel">
        <h2>楚汉象棋</h2>
        <p class="sub">选择对战模式与 AI 难度</p>
        <div id="mode-picker" class="picker">
          <button data-mode="human" class="active">人机对战</button>
          <button data-mode="ai">机器对战（观战）</button>
        </div>
        <div id="side-picker" class="picker">
          <button data-side="0" class="active">执红先行</button>
          <button data-side="1">执黑后行</button>
        </div>
        <div id="level-picker" class="picker">
          <button data-level="easy">入门</button>
          <button data-level="normal" class="active">普通</button>
          <button data-level="hard">大师</button>
          <button data-level="master">宗师</button>
          <button data-level="grandmaster">棋圣</button>
        </div>
        <div class="limit-row">
          <span>步数上限</span>
          <button type="button" data-lim="0">不限</button>
          <button type="button" data-lim="120" class="active">120</button>
          <button type="button" data-lim="200">200</button>
          <input id="limit-input" type="number" min="20" max="999" step="10" value="120" inputmode="numeric">
          <span class="limit-unit">步</span>
        </div>
        <p class="sub small">达到步数上限仍未分胜负即判和棋；连续 60 回合无吃子也自动判和</p>
        <p id="mode-tip" class="sub small" style="display:none">红黑双方均由 AI 执子，每步停留约 1 秒便于观察</p>
        <button id="btn-begin" class="primary">开始对局</button>
        <button id="btn-continue" class="ghost">继续上次对局</button>
      </div>
    </div>

    <!-- 终局遮罩 -->
    <div id="result-overlay" class="overlay" style="display:none">
      <div class="panel">
        <h2 id="result-title">你赢了</h2>
        <p id="result-reason" class="sub">将死</p>
        <button id="btn-restart" class="primary">再来一局</button>
        <button id="btn-review" class="ghost">复盘棋谱</button>
      </div>
    </div>

    <!-- 难度弹窗 -->
    <div id="level-modal" class="overlay" style="display:none">
      <div class="panel small">
        <h3>AI 难度</h3>
        <div class="level-item" data-level="easy"><b>入门</b><span>轻松对弈，适合新手</span></div>
        <div class="level-item" data-level="normal"><b>普通</b><span>五层搜索，推荐日常使用</span></div>
        <div class="level-item" data-level="hard"><b>大师</b><span>六层深度计算，全力争胜</span></div>
        <div class="level-item" data-level="master"><b>宗师</b><span>八层搜索，6 秒深度推演</span></div>
        <div class="level-item" data-level="grandmaster"><b>棋圣</b><span>十层极限计算，慢但最强</span></div>
        <button id="level-close" class="ghost">关闭</button>
      </div>
    </div>

    <!-- 步数上限弹窗（局中可改） -->
    <div id="limit-modal" class="overlay" style="display:none">
      <div class="panel small">
        <h3>步数上限</h3>
        <p class="sub small">达到上限仍未分胜负即判和棋。设为 0 表示不限制。</p>
        <div class="limit-row">
          <button type="button" data-lim="0">不限</button>
          <button type="button" data-lim="120">120</button>
          <button type="button" data-lim="200">200</button>
          <button type="button" data-lim="300">300</button>
        </div>
        <div class="limit-row">
          <input id="limit-input-modal" type="number" min="20" max="999" step="10" value="120" inputmode="numeric">
          <span class="limit-unit">步</span>
        </div>
        <button id="limit-save" class="primary">确定</button>
        <button id="limit-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="controls">
    <button id="btn-new">新对局</button>
    <button id="btn-undo">悔棋</button>
    <button id="btn-hint">提示</button>
    <button id="btn-level">难度·普通</button>
    <button id="btn-limit">步数·120</button>
    <button id="btn-sound">🔊 音效</button>
  </div>

  <div id="info">
    <div class="cap-row"><span class="cap-label">红方吃：</span><span id="captured-red">—</span></div>
    <div class="cap-row"><span class="cap-label">黑方吃：</span><span id="captured-black">—</span></div>
    <div id="move-count">第 1 手</div>
  </div>

  <div id="history"></div>
</div>
<script src="js/bundle.js"></script>
<script src="js/game.js"></script>
</body>
</html>
