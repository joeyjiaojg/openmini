plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoyou.box'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaoyou.box"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('keystore/xiaoyou.keystore')
            storePassword 'xiaoyou2026'
            keyAlias 'xiaoyou'
            keyPassword 'xiaoyou2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
